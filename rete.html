<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring · Rete SB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap">
<link rel="stylesheet" href="assets/stile.css?v=20260929j">
<link rel="stylesheet" href="assets/incontro.css?v=20260929j">
<link rel="stylesheet" href="assets/rete.css?v=20261001q">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#0e1013">
<meta name="robots" content="noindex">
<meta name="description" content="Monitoring della Rete SB: tutti i locali sui dati veri. Sola lettura.">
</head>
<body>
<!-- Monitoring: il portale della direzione. È il prototipo della console (prototipo.html)
     sui dati veri: la rete a sinistra, il dossier del locale a destra, sette schede.
     Sola lettura: i dati li inseriscono i consulenti in Managing (locale.html). -->
<div class="cancello" id="cancello" hidden>
  <form class="cancello-scheda vetro" id="accesso" autocomplete="on">
    <div class="insegna-mini"><span class="sigla">SB</span><span>Monitoring <span>Rete SB</span></span></div>
    <label for="utente">Email</label>
    <input id="utente" name="username" autocomplete="username" required>
    <label for="parola">Password</label>
    <input id="parola" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="pulsante pieno" id="entra">Entra</button>
    <p class="errore" id="errore-accesso" role="alert"></p>
  </form>
</div>
<div class="telaio" id="telaio" hidden>
  <aside class="flotta vetro">
    <div class="insegna">
      <div class="riga">
        <span class="sigla">SB</span>
        <span class="nome">Monitoring <span>della rete</span></span>
      </div>
      <div class="chi" id="chi"><span class="ico">visibility</span> Sola lettura</div>
      <a class="chi" href="locale.html" style="color:var(--accento);text-decoration:none"><span class="ico">edit_note</span> Managing: inserire i dati</a>
    </div>
    <div class="polso" id="polso"></div>
    <div class="polso-dida" id="polso-dida"></div>
    <div class="setaccio">
      <span class="ico">search</span>
      <input id="setaccio" type="search" placeholder="Cerca locale, città, consulente" aria-label="Cerca">
    </div>
    <div class="filtri" id="filtri">
      <button type="button" data-f="tutti" aria-pressed="true">Tutti</button>
      <button type="button" data-f="fuori" aria-pressed="false">Fuori parametro</button>
      <button type="button" data-f="attesa" aria-pressed="false">Attenzione</button>
      <button type="button" data-f="buono" aria-pressed="false">In linea</button>
    </div>
    <div class="lista" id="lista"></div>
    <p class="avviso">I numeri arrivano da cassa, fatture, timbrature e inventari. Note, storia e contratto li scrive il consulente in Managing. <button type="button" class="link-mini" id="esci">Esci</button></p>
  </aside>
  <main class="dossier">
    <div class="banda" id="banda"></div>
    <form class="dom-barra vetro" id="dom-barra" role="search" hidden>
      <span class="ico" aria-hidden="true">forum</span>
      <input id="dom-testo" name="q" maxlength="500" autocomplete="off" aria-label="Domanda sui dati del locale"
             placeholder="Chiedi ai dati di questo locale: «quali piatti hanno il food cost più alto?»">
      <button type="submit" class="pulsante pieno" id="dom-chiedi">Chiedi</button>
      <div class="dom-risposta" id="dom-risposta" aria-live="polite"></div>
    </form>
    <div class="linguette vetro" id="linguette" role="tablist"></div>
    <div class="lastra" id="area"></div>
  </main>
</div>
<div class="bolla" id="bolla" role="status"></div>
<script type="module" src="assets/rete.js?v=20261001w"></script>
</body>
</html>
